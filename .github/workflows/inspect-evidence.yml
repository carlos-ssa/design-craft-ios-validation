name: Inspect native evidence
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed native validation run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Download and extract result bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          gh run download "$RUN_ID" --name ios-native-evidence --dir evidence
          mkdir -p extracted
          xcodebuild -version > extracted/xcode.txt
          xcrun simctl list --json > extracted/simulators.json
          xcodebuild -showsdks > extracted/sdks.txt
          bundle=$(find evidence -maxdepth 1 -name '*.xcresult' -print -quit)
          test -n "$bundle"
          xcrun xcresulttool get test-results summary --path "$bundle" > extracted/summary.json
          xcrun xcresulttool get test-results tests --path "$bundle" > extracted/tests.json
          xcrun xcresulttool export attachments --path "$bundle" --output-path extracted/attachments
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extracted-native-evidence
          path: extracted/
          if-no-files-found: error
